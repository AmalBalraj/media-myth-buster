# myth-buster.devmindset.in
#
# Installed to /etc/nginx/sites-available/myth-buster and symlinked into
# sites-enabled. Certbot appends the TLS listener and the port-80 redirect on
# first run (`certbot --nginx`), matching the other sites on this box — so this
# file is intentionally HTTP-only.

server {
    listen 80;
    listen [::]:80;
    server_name myth-buster.devmindset.in;

    # Reels are a few MB; the API caps uploads itself but nginx must not reject
    # them first.
    client_max_body_size 120M;

    access_log /var/log/nginx/myth-buster.access.log;
    error_log  /var/log/nginx/myth-buster.error.log;

    # Server-Sent Events: pipeline progress must stream, so buffering is off and
    # the read timeout outlives the longest analysis.
    #
    # Matched by regex, not the prefix `/api/reports/`: a trailing-slash prefix
    # makes nginx 301 the collection route `/api/reports` to `/api/reports/`, and
    # it would also strip buffering from the plain JSON report routes, which want
    # it. This matches the one streaming endpoint and nothing else.
    location ~ ^/api/reports/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 900s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
