# Orchestration only — no model inference runs in this stack.
# Every port binds to 127.0.0.1; nginx on the host is the only public entrance.
# Ports 8100-8110 and 3005 are free on oracle-dev (see ARCHITECTURE.md §9.1).
services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100
    ports: ["127.0.0.1:8100:8100"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://myth:myth@postgres:5432/mythbuster
      REDIS_URL: redis://redis:6379/7
      SEARXNG_URL: http://searxng:8080
      MEDIA_DIR: /data/media
    volumes: ["./data:/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    restart: unless-stopped

  worker:
    build: ./backend
    command: arq app.worker.WorkerSettings
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://myth:myth@postgres:5432/mythbuster
      REDIS_URL: redis://redis:6379/7
      SEARXNG_URL: http://searxng:8080
      MEDIA_DIR: /data/media
    volumes: ["./data:/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    restart: unless-stopped
    # I/O-bound orchestration; caps exist so a stuck job can never starve the
    # other services already running on the box.
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 2G}

  web:
    build: ./web
    ports: ["127.0.0.1:3005:3000"]
    environment:
      # Used only for server-side fetches (the methodology page). Browser calls
      # are same-origin /api/* and are routed by nginx.
      API_BASE_URL: http://api:8100
    depends_on: [api]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: myth
      POSTGRES_PASSWORD: myth
      POSTGRES_DB: mythbuster
    ports: ["127.0.0.1:8101:5432"]
    volumes: ["./data/pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myth"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Not published: the host already runs its own redis on 6379.
    expose: ["6379"]
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    ports: ["127.0.0.1:8102:8080"]
    environment:
      SEARXNG_BASE_URL: http://localhost:8102/
    volumes: ["./infra/searxng:/etc/searxng"]
    restart: unless-stopped
